resources:
  repositories:
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release
variables:
  - name: npmPackagesDir
    value: '$(Build.SourcesDirectory)/npm-packages'
extends:
  template: /v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    settings:
      skipBuildTagsForGitHubPullRequests: true
    pool:
      name: OE-OfficeClientApps
    sdl:
      eslint:
        configuration: required
        parser: '@typescript-eslint/parser'
        parserOptions: sourceType:module
    stages:
    - stage: stage
      jobs:
      - job: Publish
        steps:
        - task: NpmAuthenticate@0
          displayName: Authenticate npm for version check
          inputs:
            workingFile: '.npmrc'
        - powershell: |
            $localVersion = (node -p "require('./package.json').version")
            $packageName = (node -p "require('./package.json').name")
            $npmOutput = (npm view $packageName version 2>&1 | Out-String)
            Write-Host "npm view exit code: $LASTEXITCODE"
            Write-Host "npm view output: $npmOutput"
            $versionMatch = [regex]::Match($npmOutput, '\d+\.\d+\.\d+')
            $publishedVersion = if ($LASTEXITCODE -eq 0 -and $versionMatch.Success) { $versionMatch.Value } else { "0.0.0" }
            Write-Host "Local version: $localVersion"
            Write-Host "Published 'latest' version: $publishedVersion"
            $highest = ([System.Management.Automation.SemanticVersion]$localVersion, [System.Management.Automation.SemanticVersion]$publishedVersion | Sort-Object)[-1].ToString()
            if ($localVersion -eq $publishedVersion -or $highest -ne $localVersion) {
              Write-Host "##vso[task.logissue type=error]Local version ($localVersion) must be newer than the published 'latest' version ($publishedVersion)."
              exit 1
            }
          displayName: Verify version is newer than published
          errorActionPreference: continue
        - template: /.azure-devops/install.yml@self
        - template: /.azure-devops/build.yml@self
        - powershell: New-Item -ItemType Directory -Force -Path '$(npmPackagesDir)'
          displayName: Create npm packages directory
        - script: npm pack --pack-destination $(npmPackagesDir)
          displayName: Create package
        - task: EsrpRelease@12
          displayName: Publish npm packages through ESRP
          inputs:
            connectedservicename: 'ESRP-Addin-DevX-Publish'
            # The service connection uses a federated credential to let the
            # onboarded managed identity authenticate without stored secrets.
            usemanagedidentity: true
            keyvaultname: 'ATK-ESRP-KEY-VAULT'
            signcertname: 'ATK-ESRP-CERT'
            clientid: '62d1b680-312a-4484-9737-fc13f2f7e6f3'
            intent: 'PackageDistribution'
            contenttype: 'PyPi' # testing with other case . . . should be 'npm'
            contentsource: 'Folder'
            folderlocation: '$(npmPackagesDir)'
            waitforreleasecompletion: true
            owners: 'darrmill@microsoft.com'
            approvers: 'darrmill@microsoft.com'
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: 'ESRPRELPACMAN'
            domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'